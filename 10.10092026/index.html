<!DOCTYPE html>
<html lang="es">
<head>

    <title>Lista</title>
</head>
<body>
    <h1>LISTA DE LOS ESTUDIANTES</h1>

    Apellido:

    <button onclick="eliminarTareas()">Limpiar</button>
    <br>
    <p id="respuesta"></p>

</body>
